<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방사성 동위원소 붕괴 시뮬레이션</title>
    <!-- Chart.js 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* 좌측 제어판 */
        #sidebar {
            width: 320px;
            background-color: #2d2d2d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        h2 {
            color: #ff9800;
            font-size: 1.2rem;
            border-bottom: 2px solid #ff9800;
            padding-bottom: 5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            color: #ccc;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            background-color: #3d3d3d;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }
        .mass-value {
            text-align: right;
            font-weight: bold;
            color: #ffca28;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        #launch-btn {
            background-color: #e65100;
            color: white;
        }
        #launch-btn:hover {
            background-color: #f57c00;
        }
        #launch-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }
        #reset-btn {
            background-color: #37474f;
            color: white;
            border: 1px solid #546e7a;
        }
        #reset-btn:hover {
            background-color: #455a64;
        }

        /* 우측 시뮬레이션 구역 */
        #simulation-container {
            flex: 1;
            position: relative;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            overflow: hidden;
        }

        /* 폭탄 애니메이션 요소 */
        #bomb {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 50px;
            background-color: #555;
            border-radius: 15px 15px 5px 5px;
            display: none;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.5);
            z-index: 5;
        }
        #bomb::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 10px;
            width: 10px;
            height: 10px;
            background-color: #ff3d00;
            border-radius: 50%;
        }

        /* 버섯구름 요소 */
        #mushroom-cloud {
            position: absolute;
            bottom: 20px;
            left: 35%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
            z-index: 4;
        }
        .head {
            background: radial-gradient(circle, #ff9800 0%, #e65100 60%, #3e2723 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 40px rgba(255, 152, 0, 0.8);
        }
        .stem {
            background: linear-gradient(to bottom, #e65100, #3e2723);
            width: 30%;
            border-radius: 5px;
        }

        /* 정보 표기 패널 (버섯구름 옆) */
        #info-panel {
            position: absolute;
            bottom: 40px;
            right: 30px;
            background: rgba(0, 0, 0, 0.85);
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #ff9800;
            display: none;
            width: 380px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 6;
        }
        #info-panel h3 {
            color: #ffca28;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        #info-text p {
            font-size: 0.9rem;
            margin: 5px 0;
            color: #ddd;
        }
        .chart-container {
            position: relative;
            height: 190px;
            margin-top: 12px;
        }

        /* 지면 표시 */
        #ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background-color: #1b5e20;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>방사성 동위원소 설정</h2>
        
        <div class="input-group">
            <label for="isotope-select">방사성 원소 선택</label>
            <select id="isotope-select">
                <option value="Pu-239">플루토늄 (반감기: 24,000년)</option>
                <option value="U-238">우라늄 (반감기: 45억년)</option>
                <option value="Ra-226">라듐 (반감기: 1,600년)</option>
                <option value="Rn-222">라돈 (반감기: 4일)</option>
                <option value="Po-210">폴로늄 (반감기: 138일)</option>
                <option value="Th-232">토륨 (반감기: 140억년)</option>
                <option value="Cs-137">세슘 (반감기: 30년)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="mass-slider">원소 질량 (g)</label>
            <input type="range" id="mass-slider" min="100" max="10000" step="100" value="1000">
            <div class="mass-value"><span id="mass-display">1000</span> g</div>
        </div>

        <div class="btn-group">
            <button id="launch-btn">원자폭탄 투하</button>
            <button id="reset-btn">다시 시도하기</button>
        </div>
    </div>

    <div id="simulation-container">
        <div id="bomb"></div>
        <div id="mushroom-cloud">
            <div class="head"></div>
            <div class="stem"></div>
        </div>
        
        <!-- 버섯구름 옆 정보 및 그래프 표기 패널 -->
        <div id="info-panel">
            <h3>방사능 데이터</h3>
            <div id="info-text"></div>
            <div class="chart-container">
                <canvas id="decayChart"></canvas>
            </div>
        </div>

        <div id="ground"></div>
    </div>

    <script>
        // 원소 데이터 정의 (반감기를 '일(days)' 단위 기준값으로 관리)
        const isotopeData = {
            "Pu-239": { name: "플루토늄-239", halfLifeText: "24,000년", halfLifeYears: 24000, isShort: false },
            "U-238":  { name: "우라늄-238", halfLifeText: "45억년", halfLifeYears: 4500000000, isShort: false },
            "Ra-226": { name: "라듐-226", halfLifeText: "1,600년", halfLifeYears: 1600, isShort: false },
            "Rn-222": { name: "라돈-222", halfLifeText: "4일", halfLifeYears: 4 / 365.25, isShort: true, days: 4 },
            "Po-210": { name: "폴로늄-210", halfLifeText: "138일", halfLifeYears: 138 / 365.25, isShort: true, days: 138 },
            "Th-232": { name: "토륨-232", halfLifeText: "140억년", halfLifeYears: 14000000000, isShort: false },
            "Cs-137": { name: "세슘-137", halfLifeText: "30년", halfLifeYears: 30, isShort: false }
        };

        // DOM 요소
        const massSlider = document.getElementById('mass-slider');
        const massDisplay = document.getElementById('mass-display');
        const launchBtn = document.getElementById('launch-btn');
        const resetBtn = document.getElementById('reset-btn');
        const bomb = document.getElementById('bomb');
        const mushroomCloud = document.getElementById('mushroom-cloud');
        const cloudHead = mushroomCloud.querySelector('.head');
        const cloudStem = mushroomCloud.querySelector('.stem');
        const infoPanel = document.getElementById('info-panel');
        const infoText = document.getElementById('info-text');

        let decayChart = null;
        let animationInterval = null;
        let dropAnimationId = null;

        // 슬라이더 이벤트
        massSlider.addEventListener('input', (e) => {
            massDisplay.textContent = Number(e.target.value).toLocaleString();
        });

        // 다시 시도하기 버튼 이벤트
        resetBtn.addEventListener('click', () => {
            resetSimulation();
        });

        // 투하 버튼 이벤트
        launchBtn.addEventListener('click', () => {
            launchBtn.disabled = true;
            resetSimulation();

            // 1. 폭탄 낙하 애니메이션 (3초 = 기존 5초에서 2초 빠르게 변경)
            bomb.style.display = 'block';
            bomb.style.top = '-50px';
            bomb.style.left = '35%'; // 버섯구름 위치와 동일하게 설정
            
            const dropDuration = 3000; // 3초
            const startTime = performance.now();
            const startTop = -50;
            const endTop = window.innerHeight - 70; // 지면 부근

            function animateDrop(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / dropDuration, 1);
                
                // 가속도 적용 (자유낙하 느낌)
                const currentTop = startTop + (endTop - startTop) * Math.pow(progress, 2);
                bomb.style.top = `${currentTop}px`;

                if (progress < 1) {
                    dropAnimationId = requestAnimationFrame(animateDrop);
                } else {
                    bomb.style.display = 'none';
                    explode(); // 폭발 시작
                }
            }
            dropAnimationId = requestAnimationFrame(animateDrop);
        });

        function resetSimulation() {
            if (animationInterval) clearInterval(animationInterval);
            if (dropAnimationId) cancelAnimationFrame(dropAnimationId);
            
            bomb.style.display = 'none';
            mushroomCloud.style.opacity = 0;
            infoPanel.style.display = 'none';
            launchBtn.disabled = false;
            
            if (decayChart) {
                decayChart.destroy();
                decayChart = null;
            }
        }

        // 폭발 및 붕괴 시뮬레이션
        function explode() {
            const selectedKey = document.getElementById('isotope-select').value;
            const isotope = isotopeData[selectedKey];
            const N0 = parseFloat(massSlider.value); // 초기 질량

            // 질량에 따른 버섯구름 크기 대폭 확장 (기존보다 더 웅장하게 표현)
            // 100g -> scale ~0.8, 10000g -> scale ~2.5
            const scale = 0.8 + (N0 / 10000) * 1.7; 
            const headSize = 160 * scale;
            const stemWidth = 40 * scale;
            const stemHeight = 180 * scale;

            cloudHead.style.width = `${headSize}px`;
            cloudHead.style.height = `${headSize * 0.75}px`;
            cloudStem.style.width = `${stemWidth}px`;
            cloudStem.style.height = `${stemHeight}px`;

            mushroomCloud.style.opacity = 1;
            infoPanel.style.display = 'block';

            const isShort = isotope.isShort;
            const labels = [];
            const dataPoints = [];
            const steps = 10; // 그래프에 표기할 10개 구간

            const halfLife = isShort ? isotope.days : isotope.halfLifeYears;

            for (let i = 0; i <= steps; i++) {
                let t = isShort ? i * 365.25 : i * 10; 
                let N_t = N0 * Math.pow(0.5, t / halfLife);
                
                labels.push(isShort ? `${i}년` : `${i * 10}년`);
                dataPoints.push(N_t.toFixed(2));
            }

            // 차트 그려주기
            renderChart(labels, dataPoints, isotope.name);

            let elapsedTime = 0; // 초 단위 진행시간
            
            function updateInfo(currentMass, passedTimeText) {
                infoText.innerHTML = `
                    <p><b>원소명:</b> ${isotope.name}</p>
                    <p><b>초기 질량 (N₀):</b> ${N0.toLocaleString()} g</p>
                    <p><b>반감기 (t<sub>1/2</sub>):</b> ${isotope.halfLifeText}</p>
                    <p><b>경과 시간:</b> ${passedTimeText}</p>
                    <p><b>남은 질량 (N):</b> <span style="color:#ff3d00; font-weight:bold;">${currentMass.toFixed(2)} g</span></p>
                `;
            }

            animationInterval = setInterval(() => {
                elapsedTime += 0.1;
                
                let t_sim = elapsedTime * 10;
                let currentN = N0 * Math.pow(0.5, t_sim / halfLife);

                let opacity = Math.max(0.1, currentN / N0);
                mushroomCloud.style.opacity = opacity;

                let passedTimeText = isShort 
                    ? `${(t_sim).toFixed(1)} 일` 
                    : `${(t_sim).toFixed(1)} 년`;

                updateInfo(currentN, passedTimeText);

                if (currentN < 0.01 || elapsedTime > 30) {
                    clearInterval(animationInterval);
                    launchBtn.disabled = false;
                }
            }, 100);
        }

        // Chart.js를 사용한 반감기 그래프 렌더링
        function renderChart(labels, data, title) {
            const ctx = document.getElementById('decayChart').getContext('2d');
            
            decayChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${title} 붕괴 곡선 (g)`,
                        data: data,
                        borderColor: '#ff9800',
                        backgroundColor: 'rgba(255, 152, 0, 0.25)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            ticks: { color: '#ccc', font: { size: 10 } },
                            grid: { color: '#444' }
                        },
                        y: {
                            ticks: { color: '#ccc', font: { size: 10 } },
                            grid: { color: '#444' },
                            title: { display: true, text: '질량 (g)', color: '#ccc' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#fff', font: { size: 11 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
